# Use an explicitly confirmed LucSys configuration; no model is inferred.
car_mode: ""
# Enable and disable the NAV2 navigation ultrasonic obstacle avoidance function false disable true on
# This configuration is only valid for models equipped with ultrasonic hardware
ultrasonic_avoid: false

# Optional radar model Fill in the corresponding lidar_type
  # ls_M10_uart ls_M10_net ls_M10P_uart ls_M10P_net  ls_M10P_uart_double
  # ls_N10_uart ls_N10_net ls_N10Plus_uart ls_N10Plus_net  
  # ldstl19p ldstl06nbj ldstl19n rplidar_c1  
  # lscx

lidar_type: ls_M10P_uart     

# ls_M10/ls_N10 series single-line radars can be modified
x10:
  lidar_port: /dev/lucsys_lidar  # LiDAR serial port name; leave empty for Ethernet
  angle_disable_min: [11000]         # Minimum LiDAR scan clipping angle; integer, e.g. 12000; unit: 0.01 degrees
  angle_disable_max: [25000]        # Maximum LiDAR scan clipping angle; integer, e.g. 24000; unit: 0.01 degrees

# LSCX series multi-line radars can be modified
lscx:
  angle_disable_min: [12000]        # Minimum LiDAR scan clipping angle; integer, e.g. 12000; unit: 0.01 degrees
  angle_disable_max: [24000]         # Maximum LiDAR scan clipping angle; integer, e.g. 24000; unit: 0.01 degrees

# Optional IMU model Enter the corresponding imu_mode
  # stm32  H30  N300pro

imu_mode: stm32 

# Optional camera models Enter the corresponding camera_mode
  # astra  astra_pro   dabai_u3   gemini   usb

camera_mode: astra_pro
